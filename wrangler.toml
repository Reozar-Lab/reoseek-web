name = "reodeep-web"
main = "worker.js"
compatibility_date = "2026-11-22"

# 静态资源托管 (官方 Demo 打包后的前端 dist)
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_id = "aac4f241-97e3-4e1b-99ba-f33151f68b4f"


# 自定义域名
[custom_domain]
domain = "reoseek.de5.net"

# 环境变量
# [vars]
# 准入码，前端输入这个才能用
# ACCESS_CODE = "secarea2026"

# DEEPSEEK_API_KEY 请使用 wrangler secret put 命令配置！