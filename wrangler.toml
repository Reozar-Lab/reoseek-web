name = "reodeep-web"
main = "worker.js"
compatibility_date = "2026-11-22"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_id = "aac4f241-97e3-4e1b-99ba-f33151f68b4f"

# KV缓存
[[kv_namespaces]]
binding = "KV"
id = "3d0b29a79cb849359a8b6878df5624a5"

# 自定义主域名 (网关)
[custom_domain]
domain = "reoseek.de5.net"

# 环境变量
[vars]
# 准入码
ACCESS_CODE = "292125"
# 跳转的子域名地址
CHAT_DOMAIN = "https://chat.reoseek.de5.net"

# DEEPSEEK_API_KEY 请在 CF 控制台配置